<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillsTrack - Assessor Overview</title>
    <link rel="stylesheet" href="css/layout.css" />

    <style>
      a {
        text-decoration: none;
      }

      /* The assessor sidebar uses a purple active link */
      .sidebar-assessor .sidebar-nav-item-active {
        background: #7b55b5;
      }

      .date-display {
        font-size: 13px;
        color: #7c7f88;
        margin-bottom: 5px;
      }

      /* --- Four number cards (soft colour, big coloured number) --- */
      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-bottom: 30px;
      }
      .metric-card {
        border-radius: 12px;
        padding: 20px;
      }
      .metric-card .value {
        font-size: 28px;
        font-weight: bold;
      }
      .metric-card .label {
        font-size: 12px;
        color: #4b4e57;
        margin-top: 6px;
      }
      .metric-card.active-learners {
        background-color: #fde8e2;
      }
      .metric-card.active-learners .value {
        color: #f2643f;
      }
      .metric-card.pending-bookings {
        background-color: #ece8f5;
      }
      .metric-card.pending-bookings .value {
        color: #7b55b5;
      }
      .metric-card.sessions {
        background-color: #ddf5ee;
      }
      .metric-card.sessions .value {
        color: #1aa88a;
      }
      .metric-card.progress {
        background-color: #fdf6dc;
      }
      .metric-card.progress .value {
        color: #c8921a;
      }

      /* --- Bookings on the left, attention panel on the right --- */
      .workspace {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 30px;
      }
      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 15px;
      }
      .section-title {
        font-size: 16px;
        color: #26272b;
        font-weight: bold;
      }
      .section-link {
        font-size: 12px;
        font-weight: bold;
        color: #7b55b5;
      }

      /* --- Booking request cards (filled in by js/assessor-overview.js) --- */
      .booking-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .request-card {
        background: white;
        border: 1px solid #e5dccb;
        border-radius: 12px;
        padding: 16px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .user-info {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .avatar {
        width: 36px;
        height: 36px;
        background-color: #ece8f5;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 12px;
        color: #5b4a85;
      }
      .details .name {
        color: #26272b;
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 3px;
      }
      .details .meta {
        color: #7c7f88;
        font-size: 11px;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      .btn-confirm {
        background-color: #ddf5e6;
        color: #2f9e64;
        border: none;
        font-size: 11px;
        font-weight: bold;
        padding: 6px 14px;
        border-radius: 8px;
        cursor: pointer;
      }
      .btn-decline {
        background-color: #fde3e1;
        color: #d8493e;
        border: none;
        font-size: 11px;
        font-weight: bold;
        padding: 6px 14px;
        border-radius: 8px;
        cursor: pointer;
      }
      .btn-confirm:hover,
      .btn-decline:hover {
        opacity: 0.85;
      }

      /* --- Attention Needed cards --- */
      .attention-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .attention-card {
        background: white;
        border: 1px solid #e5dccb;
        border-radius: 12px;
        padding: 14px 16px;
        display: flex;
        gap: 12px;
      }
      .attention-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #fde8e2;
        color: #f2643f;
        font-size: 11px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .attention-name {
        font-size: 13px;
        font-weight: bold;
        color: #26272b;
      }
      .attention-programme {
        font-size: 11px;
        color: #7c7f88;
        margin-bottom: 8px;
      }
      .pill-tasks {
        background: #fde3e1;
        color: #d8493e;
        font-size: 10px;
        padding: 3px 8px;
        border-radius: 10px;
        margin-right: 6px;
      }
      .pill-progress {
        background: #ece8f5;
        color: #7b55b5;
        font-size: 10px;
        padding: 3px 8px;
        border-radius: 10px;
      }
      .empty-message {
        font-size: 13px;
        color: #7c7f88;
      }
    </style>
  </head>

  <body>
    <div class="app-layout">
      <aside class="sidebar-assessor">
        <div class="sidebar-logo">
          <div class="sidebar-logo-box">ST</div>
          <div class="sidebar-logo-text">SkillsTrack</div>
        </div>

        <!-- Assessor box (filled in from the signed-in assessor's profile) -->
        <div class="sidebar-user">
          <div class="sidebar-avatar" id="sidebarInitials"></div>
          <div>
            <div class="sidebar-user-name" id="sidebarName"></div>
            <div class="sidebar-user-role" id="sidebarJobTitle"></div>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a class="sidebar-nav-item-active" href="assessor_overview.html"
            >Overview</a
          >
          <a class="sidebar-nav-item" href="assessor accept or decline.html"
            >Bookings</a
          >
          <a class="sidebar-nav-item" href="learner-activity.html"
            >Learner Activity</a
          >
        </nav>

        <div class="sidebar-footer">
          <button id="darkModeBtn">☾ Dark Mode</button>
          <button id="signOutButton" class="sidebar-nav-item">Sign out</button>
        </div>
      </aside>

      <!-- Main content -->
      <main class="main-content">
        <!-- Page heading -->
        <div class="page-header">
          <div>
            <div class="date-display" id="currentDate"></div>
            <h1 class="page-title">Assessor Overview</h1>
            <div class="page-subtitle" id="headerMeta"></div>
          </div>
        </div>

        <!-- Number cards -->
        <div class="metrics-grid">
          <div class="metric-card active-learners">
            <div class="value" id="activeLearners">0</div>
            <div class="label">Active Learners</div>
          </div>
          <div class="metric-card pending-bookings">
            <div class="value" id="pendingBookings">0</div>
            <div class="label">Pending Bookings</div>
          </div>
          <div class="metric-card sessions">
            <div class="value" id="sessionsThisMonth">0</div>
            <div class="label">Sessions This Month</div>
          </div>
          <div class="metric-card progress">
            <div class="value" id="avgProgress">0%</div>
            <div class="label">Avg. Progress</div>
          </div>
        </div>

        <div class="workspace">
          <div>
            <div class="section-header">
              <div class="section-title">Bookings Needing Confirmation</div>
              <a class="section-link" href="assessor accept or decline.html"
                >All bookings →</a
              >
            </div>
            <div class="booking-list" id="pendingList"></div>
          </div>

          <div>
            <div class="section-header">
              <div class="section-title">Attention Needed</div>
            </div>
            <div class="attention-list" id="attentionList"></div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="js/assessoroverview.js"></script>
  </body>
</html>
