<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Track Login</title>
    <style>
        :root {
            --primary-blue: #1e40af;
            --light-gray: #f3f4f6;
            --border-gray: #9ca3af;
            --text-dark: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            display: flex;
            width: 900px;
            height: 550px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        /* Left Side Panel */
        .left-panel {
            flex: 1;
            background-color: var(--primary-blue);
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left-panel h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .left-panel p {
            font-size: 1.1rem;
            line-height: 1.6;
            opacity: 0.9;
        }

        /* Right Side Form */
        .right-panel {
            flex: 1;
            background-color: var(--light-gray);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-panel h2 {
            font-size: 2rem;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .role-selection {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        /* Role Buttons styling */
        .role-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border-gray);
            background: transparent;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-dark);
            transition: all 0.3s ease;
            text-align: center;
        }

        .role-btn:hover {
            background-color: #e5e7eb;
        }

        /* Active click state */
        .role-btn.active {
            background-color: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
            box-shadow: 0 4px 10px rgba(30, 64, 175, 0.3);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #4b5563;
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-gray);
            border-radius: 6px;
            box-sizing: border-box;
            background: white;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #fca5a5; /* Matching the soft red pink color from image */
            color: var(--text-dark);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background-color: #f87171;
        }

        .trouble-text {
            text-align: center;
            margin-top: 15px;
            font-size: 0.85rem;
            color: #6b7280;
        }

        .trouble-text a {
            color: var(--primary-blue);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Left Banner -->
        <div class="left-panel">
            <h1>Your learning, tracked and supported.</h1>
            <p>A central hub for learners and assessors—tasks, sessions, resources and progress all in one place.</p>
        </div>

        <!-- Right Login Form -->
        <div class="right-panel">
            <h2>Welcome back!</h2>
            <p class="subtitle">sign in to access your portal.</p>

            <form id="loginForm">
                <div class="role-selection">
                    <!-- Interactive Buttons -->
                    <button type="button" class="role-btn" id="btnLearner" onclick="selectRole('learner')">learner</button>
                    <button type="button" class="role-btn" id="btnAssessor" onclick="selectRole('assessor')">assessor</button>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>

                <button type="submit" class="submit-btn">Sign In</button>
                
                <p class="trouble-text">Trouble signing in? <a href="#">contact your assessor</a></p>
            </form>
        </div>
    </div>

    <!-- Firebase App and Auth SDK modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // Your Firebase configuration (Replace with your actual Firebase project config keys)
        const firebaseConfig = {
             apiKey: "AIzaSyCMRGMyy2sjC6CF2asxxVOm3YQ0JLf9Bys",
             authDomain: "skillstrack-c9591.firebaseapp.com",
             projectId: "skillstrack-c9591",
             storageBucket: "skillstrack-c9591.firebasestorage.app",
             messagingSenderId: "780408370394",
             appId: "1:780408370394:web:29fca21abe35f0a77aa1e3",
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Keep track of the currently selected role (default matching active class is learner)
        let selectedRole = 'learner';

        // JavaScript function to toggle visual states of buttons
        window.selectRole = function(role) {
            selectedRole = role;
            
            const learnerBtn = document.getElementById('btnLearner');
            const assessorBtn = document.getElementById('btnAssessor');

            if (role === 'learner') {
                learnerBtn.classList.add('active');
                assessorBtn.classList.remove('active');
            } else {
                assessorBtn.classList.add('active');
                learnerBtn.classList.remove('active');
            }
            console.log("Current selected role database layer target:", selectedRole);
        };

        // Form submission and Firebase authentication handler
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Log entry variables for validation
            console.log(`Attempting login for Role: ${selectedRole}, Email: ${email}`);

            // Firebase authentication call
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    alert(`Successfully signed in as ${selectedRole}!`);
                    
                    // Route users to their specific UI paths based on their selection
                    if(selectedRole === 'learner') {
                        window.location.href = '/learner-dashboard.html';
                    } else {
                        window.location.href = '/assessor-dashboard.html';
                    }
                })
                .catch((error) => {
                    console.error("Authentication Error: ", error.message);
                    alert("Failed to authenticate: " + error.message);
                });
        });
    </script>
</body>
</html>
