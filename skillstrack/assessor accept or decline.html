<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Session Bookings — SkillsTrack</title>
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/bookings.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body>
    <div class="app-layout">
      <div class="sidebar-assessor">
        <div class="sidebar-logo">
          <div class="sidebar-logo-box">ST</div>
          <span class="sidebar-logo-text">SkillsTrack</span>
        </div>

        <div class="sidebar-user">
          <div class="sidebar-avatar" id="sidebarInitials"></div>
          <div>
            <div class="sidebar-user-name" id="sidebarName"></div>
            <div class="sidebar-user-role" id="sidebarJobTitle"></div>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a class="sidebar-nav-item" href="assessor_overview.html">Overview</a>
          <a class="sidebar-nav-item-active" href="assessor accept or decline.html">Bookings</a>
          <a class="sidebar-nav-item" href="learner-activity.html">Learner Activity</a>
        </nav>

        <div class="sidebar-footer">
          <button id="darkModeBtn">☾ Dark Mode</button>
          <button id="signOutButton" class="sidebar-nav-item">Sign out</button>
        </div>
      </div>

      <div class="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Session Bookings</h1>
            <p class="page-subtitle">
              Review and manage learner session requests.
            </p>
          </div>
        </div>

        <div class="filter-pills">
          <button class="filter-pill-active" id="filterAllBookings">All Bookings</button>
          <button class="filter-pill" id="filterPending">Pending</button>
          <button class="filter-pill" id="filterConfirmed">Confirmed</button>
        </div>

        <div class="booking-list" id="bookingList"></div>
      </div>
    </div>

    <script type="module" src="js/assessorbooking.js"></script>
