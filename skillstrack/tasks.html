<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Tasks — SkillsTrack</title>
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body>
    <div class="app-layout">
      <div class="sidebar">
        <div class="sidebar-logo">
          <div class="sidebar-logo-box">ST</div>
          <span class="sidebar-logo-text">SkillsTrack</span>
        </div>
        <div class="sidebar-user">
          <div class="sidebar-avatar" id="sidebarInitials"></div>
          <div>
            <div class="sidebar-user-name" id="sidebarName"></div>
            <div class="sidebar-user-role" id="sidebarProgramme"></div>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a class="sidebar-nav-item" href="learner_dashboard.html">Home</a>
          <a class="sidebar-nav-item" href="tasks.html">My Tasks</a>
          <a class="sidebar-nav-item" href="book assessors.html">Book a Session</a>
          <a class="sidebar-nav-item" href="resources.html">Resources</a>
          <a class="sidebar-nav-item" href="#">Coding Practice</a>
          <a class="sidebar-nav-item-active" href="progress.html">My Progress</a>
        </nav>
        <div class="sidebar-footer">
          <button id="darkModeBtn">☾ Dark Mode</button>
          <button id="signOutButton" class="sidebar-nav-item">Sign out</button>
        </div>
      </div>
      <div class="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">My Tasks</h1>
            <p class="page-subtitle" id="taskCounts"></p>
          </div>
        </div>
        <div class="add-task-bar">
          <input
            class="add-task-input"
            type="text"
            id="newTaskTitle"
            placeholder="e.g.	Complete	Unit	4	evidence	log..."
          />
          <button class="btn-primary" id="addTaskButton">+ Add Task</button>
        </div>
        <div class="filter-pills">
          <button class="filter-pill-active" id="filterAll">All</button>
          <button class="filter-pill" id="filterOutstanding">
            Outstanding
          </button>
          <button class="filter-pill" id="filterCompleted">Completed</button>
        </div>
        <div class="task-list" id="taskList"></div>
      </div>
    </div>
    <script type="module" src="js/tasks.js"></script>
  </body>
</html>
