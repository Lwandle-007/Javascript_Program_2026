<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillsTrack - Assessor Overview</title>
    <link rel="stylesheet" href="css/layout.css">


    <style>
        a {
            text-decoration: none;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .metric-card {
            border-radius: 8px;
            padding: 20px;
            color: white;
            text-align: center;
        }
        .metric-card.active-learners { background-color: #16a34a; }
        .metric-card.pending-bookings { background-color: #ea580c; }
        .metric-card.sessions { background-color: #0284c7; }
        .metric-card.progress { background-color: #1c2333; }
        .metric-card .value {
            font-size: 32px;
            font-weight: bold;
        }
        .metric-card .label {
            font-size: 14px;
            margin-top: 5px;
            opacity: 0.9;
        }

        /* Bookings on the left, attention panel on the right */
        .workspace {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }
        .section-title {
            font-size: 18px;
            color: #26272b;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* Booking request cards */
        .booking-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .request-card {
            background: white;
            border: 1px solid #e5dccb;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .avatar {
            width: 45px;
            height: 45px;
            background-color: #e5dccb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #26272b;
        }
        .details h4 {
            color: #26272b;
            font-size: 16px;
            margin-bottom: 2px;
        }
        .details p {
            color: #7c7f88;
            font-size: 14px;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn:hover { opacity: 0.9; }
        .btn-confirm { background-color: #dcfce7; color: #15803d; }
        .btn-decline { background-color: #fee2e2; color: #b91c1c; }
        .attention-panel {
            background: white;
            border: 1px solid #e5dccb;
            border-radius: 8px;
            padding: 20px;
            align-self: start;
        }
        .attention-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
        }
    </style>
</head>

    <div class="app-layout">

        <aside class="sidebar-assessor">

            <div class="sidebar-logo">
                <div class="sidebar-logo-box">ST</div>
                <div class="sidebar-logo-text">SkillsTrack</div>
            </div>

            <div class="sidebar-user">
                <div class="sidebar-avatar">A</div>
                <div>
                    <div class="sidebar-user-name" id="sidebar-assessor-name">Loading...</div>
                    <div class="sidebar-user-role">Assessor Portal</div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="sidebar-nav-item-active">Overview</a>
                <a href="#" class="sidebar-nav-item">Booking</a>
                <a href="learner-activity.html" class="sidebar-nav-item">Learner Activity</a>
            </nav>

            <div class="sidebar-footer">
                <a href="#">Sign out</a>
            </div>
        </aside>

        <!-- Main content -->
        <main class="main-content">

            <!-- Page heading -->
            <div class="page-header">
                <div>
                    <h1 class="page-title">Assessor Overview</h1>
                    <div class="page-subtitle" id="header-assessor-meta">Loading...</div>
                </div>
            </div>

            <!-- Metric counter cards -->
            <div class="metrics-grid">
                <div class="metric-card active-learners">
                    <div class="value" id="count-active">--</div>
                    <div class="label">Active Learners</div>
                </div>
                <div class="metric-card pending-bookings">
                    <div class="value" id="count-pending">--</div>
                    <div class="label">Pending Bookings</div>
                </div>
                <div class="metric-card sessions">
                    <div class="value" id="count-sessions">--</div>
                    <div class="label">Sessions this month</div>
                </div>
                <div class="metric-card progress">
                    <div class="value" id="count-progress">--%</div>
                    <div class="label">Avg Progress</div>
                </div>
            </div>

            <div class="workspace">
                <div>
                    <div class="section-title">Booking Needing Confirmation</div>
                    <div class="booking-list" id="booking-container">
                        <div style="color: #7c7f88; font-size: 14px;" id="loading-bookings-msg">Awaiting server callback stream...</div>
                    </div>
                </div>

                <div>
                    <div class="section-title">Attention Needed</div>
                    <div class="attention-panel" id="attention-container">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMRGMyy2sjC6CF2asxxVOm3YQ0JLf9Bys",
            authDomain: "skillstrack-c9591.firebaseapp.com",
            projectId: "skillstrack-c9591",
            storageBucket: "skillstrack-c9591.firebasestorage.app",
            messagingSenderId: "780408370394",
            appId: "1:780408370394:web:29fca21abe35f0a77aa1e3",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function formatRelativeDate(daysOffset) {
            const options = { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' };
            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + parseInt(daysOffset || 0));
            return targetDate.toLocaleDateString('en-US', options).replace(',', '');
        }

        onValue(ref(db, 'dashboard/assessor'), (snapshot) => {
            const data = snapshot.val() || { name: "Londeka", center: "SkillsTrack Training Center" };
            const assessorName = document.querySelector('[data-assessor-name]');
            const assessorCenter = document.querySelector('[data-assessor-center]');

            if (assessorName) assessorName.textContent = data.name;
            if (assessorCenter) assessorCenter.textContent = data.center;
        });
    </script>
</body>
</html>
